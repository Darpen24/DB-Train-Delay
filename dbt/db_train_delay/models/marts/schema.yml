version: 2

models:
  - name: fct_route_reliability
    description: Route-level train reliability metrics.
    columns:
      - name: route_id
        tests:
          - not_null
      - name: event_count
        tests:
          - not_null
      - name: cancellation_rate_pct
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true

