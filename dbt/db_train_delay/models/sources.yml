version: 2

sources:
  - name: silver
    description: Cleaned train events from the silver lakehouse layer.
    freshness:
      warn_after: {count: 36, period: hour}
      error_after: {count: 72, period: hour}
    loaded_at_field: ingested_at
    tables:
      - name: train_events
        columns:
          - name: route_id
            tests:
              - not_null
          - name: planned_departure
            tests:
              - not_null
          - name: ingested_at
            tests:
              - not_null
