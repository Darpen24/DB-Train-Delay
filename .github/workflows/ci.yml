name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Pipeline smoke test
        run: python scripts/run_local_pipeline.py

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt
        working-directory: infra/terraform
        run: terraform fmt -check

  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dbt
        run: pip install dbt-core dbt-duckdb dbt-athena-community
      - name: Prepare dbt profile
        working-directory: dbt/db_train_delay
        run: cp profiles.yml.example profiles.yml
      - name: dbt deps
        working-directory: dbt/db_train_delay
        run: dbt deps --profiles-dir .
      - name: dbt seed
        working-directory: dbt/db_train_delay
        run: dbt seed --profiles-dir .
      - name: dbt parse
        working-directory: dbt/db_train_delay
        run: dbt parse --profiles-dir .
