version: 2

models:
  - name: dim_routes
    description: Route dimension for origin, destination, route type, and distance.
    columns:
      - name: route_id
        tests:
          - not_null
          - unique
  - name: fct_route_reliability
    description: Route-level train reliability metrics.
    columns:
      - name: route_id
        tests:
          - not_null
          - unique
      - name: event_count
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
              inclusive: true
      - name: delay_frequency_pct
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true
      - name: cancellation_rate_pct
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true
      - name: platform_change_rate_pct
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true
      - name: on_time_rate_pct
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true
      - name: reliability_score
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true
